name: CI

on:
  push:
    branches:
      - "master"
      - "develop"
    tags:
      - "v*"
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/images/**"
      - "config.toml"
      - "docker-compose.yml"
      - "Makefile"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/images/**"
      - "config.toml"
      - "docker-compose.yml"
      - "Makefile"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are safe to cancel mid-flight. A branch or tag run publishes
  # images and release assets, so let it finish even when another push lands.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  BUN_VERSION: "1.3.14"

permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Fetch web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Lint web frontend
        working-directory: web
        run: bun run lint

      - name: Test web frontend
        working-directory: web
        run: bun run test

      # `bun run build` is `tsc -b && vite build`, so this typechecks the
      # frontend as well as producing the bundle the Go binary embeds.
      - name: Build web frontend
        working-directory: web
        run: CI= bun run build

      - name: Upload web production build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # main.go has //go:embed web/dist, so the Go packages only compile with a
      # dist directory present. Neither the linter nor the unit tests serve real
      # assets, so a placeholder index.html is enough to satisfy the embed.
      - name: Prepare embed placeholder
        run: mkdir -p web/dist && printf '<!doctype html>\n' > web/dist/index.html

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Test Go
        run: go test -race ./...

  goreleaserbuild:
    name: Build distribution binaries
    # Both goreleaser steps below are conditioned on a PR or a tag, so on a
    # branch push this job used to set itself up and then do nothing.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [web, go]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # goreleaser derives the version and changelog from history and tags.
          fetch-depth: 0

      - name: Download web production build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser build
        if: github.event_name == 'pull_request'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate,publish --parallelism 5 --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser build and publish tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --parallelism 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create web-dist artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: mkdir -p dist && tar czf dist/web-dist.tar.gz web/dist

      - name: Upload web-dist to release assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/web-dist.tar.gz

      - name: Upload assets
        uses: actions/upload-artifact@v7
        with:
          name: moviepickarr
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.deb
            dist/*.rpm

  docker:
    name: Build Docker images (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [web, go]
    permissions:
      contents: read
      packages: write
    strategy:
      # One architecture failing says nothing about the others, and the
      # emulated targets flake. Cancelling the whole matrix over a riscv64
      # segfault means re-running fourteen builds to recover one.
      fail-fast: false
      matrix:
        # A PR only needs proof the image still builds, so it covers the two
        # platforms people actually run. Branch and tag pushes, which publish,
        # build the full set.
        #
        # linux/arm64 builds on a native arm64 runner, so the one emulated
        # instruction in ci.Dockerfile (the runner stage's apk add) runs for
        # real there. Everything else still goes through QEMU.
        #
        # linux/amd64/v4, linux/mips64 and linux/mips64le stay out: no runner
        # or user has asked for them.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]' || '[{"platform":"linux/386","runner":"ubuntu-latest"},{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/amd64/v2","runner":"ubuntu-latest"},{"platform":"linux/amd64/v3","runner":"ubuntu-latest"},{"platform":"linux/arm/v6","runner":"ubuntu-latest"},{"platform":"linux/arm/v7","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"},{"platform":"linux/ppc64le","runner":"ubuntu-latest"},{"platform":"linux/riscv64","runner":"ubuntu-latest"},{"platform":"linux/s390x","runner":"ubuntu-latest"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download web production build
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      # The arm64 runner builds its own architecture, so there is nothing to
      # emulate and no binfmt handler to register.
      - name: Set up QEMU
        if: matrix.runner != 'ubuntu-24.04-arm'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Supported Architectures
        run: docker buildx ls

      - name: Build and publish image
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ './ci.Dockerfile' }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ (github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request') && 'true' || 'false' }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Export image digest
        id: digest-prep
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          echo "manifest-hash=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digests-${{ steps.digest-prep.outputs.manifest-hash }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish Docker multi-arch manifest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}},prefix=v
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
