services:
  moviepackarr:
    container_name: moviepackarr
    image: ghcr.io/nuxencs/moviepackarr
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      PUID: 1000
      PGID: 1000
      UMASK: 002
      TZ: Etc/UTC
      TMDB_API_KEY: <your_key>
    volumes:
      - ~/.config/moviepickarr:/app
